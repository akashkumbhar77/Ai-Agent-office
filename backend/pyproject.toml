[project]
name = "fable-backend"
version = "0.1.0"
description = "Project Fable — multi-agent orchestration backend"
requires-python = ">=3.11"
dependencies = [
    "openai>=3.8",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "langgraph>=0.2.45",
    "langgraph-checkpoint-sqlite>=2.0",
    "httpx>=0.27",
    "openai>=3.8.0",
    "aiosqlite>=0.22.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.13",
    "ruff>=0.8",
    "httpx>=0.28.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["app/protocol", "app/world", "app/tools", "app/llm", "app/agents", "app/graph", "app/transport", "app/main.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
